name = "claude-proxy-v3"
main = "src/index.ts"
compatibility_date = "2025-01-21"

[vars]
LOCAL_TOKEN_COUNTING = "false"
LOCAL_TOKEN_COUNTING_FACTOR = "4"
ALLOWED_HOSTS="127.0.0.1,localhost,api.qnaigc.com"
DEV_MODE=true
ALLOWED_ORIGINS="*"
IMAGE_BLOCK_DATA_MAX_SIZE = "10485760"  # 10MB

# Fixed route target configuration (for openai-completions mode)
FIXED_ROUTE_TARGET_URL = "https://api.qnaigc.com"
FIXED_ROUTE_PATH_PREFIX = ""

# Upstream routing modes
# 'native' = pass through to native API (Claude/Gemini)
# 'openai-completions' = convert to OpenAI format
MESSAGES_UPSTREAM_MODE = "openai-completions"
INTERACTIONS_UPSTREAM_MODE = "native"
GENERATE_CONTENT_UPSTREAM_MODE = "native"

# Native API endpoints
CLAUDE_BASE_URL = "https://api.anthropic.com"
GEMINI_BASE_URL = "https://generativelanguage.googleapis.com"
GEMINI_API_VERSION = "v1beta"

LOG_LEVEL = "debug"

[observability.logs]
enabled = true
