name = "model-proxy-v3"
main = "src/index.ts"
compatibility_date = "2025-01-21"
compatibility_flags = ["nodejs_compat"]

[vars]
VERSION = "v1.7.1@feature/composite"  # Set to commit id, tag, or branch name
LOCAL_TOKEN_COUNTING=true      # Enable local counting
LOCAL_TIKTOKEN=true            # Use tiktoken (accurate)
TIKTOKEN_MODEL="o200k_base"    # Encoding model

MODELS_CACHE_TTL=300           # cache models list from upstream
UPSTREAM_BODY_TIMEOUT_MS=600000    # upstream body fetch timeout in ms

ALLOWED_HOSTS="127.0.0.1,localhost,api.qnaigc.com,api.example1.com,api.example2-ai.com,api.yoosheen.com,api.wenwen-ai.com"
DEV_MODE=true
ALLOWED_ORIGINS="*"
IMAGE_BLOCK_DATA_MAX_SIZE = "10485760"  # 10MB

# Proxy config file path or Consul server address
#PROXY_CONFIG_PATH = "./proxy_config.toml"
# When set, PROXY_CONFIG_URL points to a Consul server, e.g. http://localhost:8500
# The loader reads the KV prefix: model-proxy-v3/
PROXY_CONFIG_URL = "http://localhost:8500"

LOG_LEVEL = "info"

[observability.logs]
enabled = true
