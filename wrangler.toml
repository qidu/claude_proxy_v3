name = "claude-proxy-v3"
main = "src/index.ts"
compatibility_date = "2025-01-21"

[vars]
VERSION = "dev"  # Set to commit id, tag, or branch name
LOCAL_TOKEN_COUNTING = "false"
LOCAL_TOKEN_COUNTING_FACTOR = "4"
ALLOWED_HOSTS="127.0.0.1,localhost,api.qnaigc.com,api.yoosheen.com"
DEV_MODE=true
ALLOWED_ORIGINS="*"
IMAGE_BLOCK_DATA_MAX_SIZE = "10485760"  # 10MB

# Fixed route target configuration (for openai-completions mode)
FIXED_ROUTE_TARGET_URL = "https://api.qnaigc.com"
FIXED_ROUTE_PATH_PREFIX = ""

# Proxy config file path or URL
PROXY_CONFIG_PATH = "./proxy_config.toml"
# PROXY_CONFIG_URL = "http://eureka-server/config/proxy_config.toml"

LOG_LEVEL = "debug"

[observability.logs]
enabled = true
