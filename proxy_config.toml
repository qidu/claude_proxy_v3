# Proxy Configuration
# Supports single upstream per model with mode-based routing

[upstream]
# Default upstream for openai-completions mode
default_url = "https://api.qnaigc.com"
default_api_key = "sk-87abde0542f469******"

# ============================================
# Model-specific routing examples
# ============================================
# IMPORTANT: Model IDs in config must be normalized:
# - Replace "/" with "-" (e.g., "deepseek/deepseek-v3.2-exp" → "deepseek-deepseek-v3-2-exp")
# - Replace "." with "-" (e.g., "gemini-2.5-flash" → "gemini-2-5-flash")
# - The proxy automatically normalizes model names from API requests
# - Original model names are preserved in upstream API calls

# Example 1: Native Gemini API
# API request uses: "model": "gemini-2.5-flash"
# Config section uses: [models.gemini-2-5-flash]
[models.gemini-2-5-flash]
mode = "native"
base_url = "https://api.example1.com"
api_key = "sk-rFaHPAoJid******"

# Example 2: Native Claude API with model alias
[models.claude-4-5-sonnet]
mode = "native"
# model_alias = "claude-opus-4-1-20250805"
# model_alias = "claude-3-5-sonnet-20240620
# model_alias = "claude-3-5-sonnet-20241022
# model_alias = "claude-3-7-sonnet-20250219
model_alias = "claude-3-7-sonnet-20250219-thinking"
# model_alias = "claude-haiku-4-5-20251001
# model_alias = "claude-haiku-4-5-20251001-thinking
# model_alias = "claude-opus-4-1-20250805
# model_alias = "claude-opus-4-1-20250805-thinking
# model_alias = "claude-opus-4-20250514
# model_alias = "claude-opus-4-20250514-thinking
base_url = "https://api.example2.com"
api_key = "sk-NzBalLnHTBdlL23pQH******"

# Example 3: DeepSeek with "/" in name
# API request uses: "model": "deepseek/deepseek-v3.2-exp"
# Config section uses: [models.deepseek-deepseek-v3-2-exp]
[models.deepseek-deepseek-v3-2]
mode = "openai-completions"

# Example 4: MiniMax with "/" in name
# API request uses: "model": "minimax/minimax-m2.1"
# Config section uses: [models.minimax-minimax-m2-1]
[models.minimax-minimax-m2-1]
mode = "openai-completions"

# Example 5: GLM with "/" in name
# API request uses: "model": "z-ai/glm-5"
# Config section uses: [models.z-ai-glm-5]
[models.z-ai-glm-5]
mode = "openai-completions"

# Example 6: GPT-OSS (uses default upstream)
[models.gpt-oss-120b]
mode = "openai-completions"

# Example 7: DeepSeek R1 (reasoning model, uses default upstream)
[models.deepseek-r1]
mode = "openai-completions"

# ============================================
# Default mode for all unconfigured models
# ============================================
[defaults]
mode = "openai-completions"

# ============================================
# Notes:
# ============================================
# - Each model supports ONE upstream only (single base_url)
# - mode = "native": Direct pass-through to native API (Claude/Gemini)
# - mode = "openai-completions": Convert to OpenAI format
# - If base_url is omitted, uses default_url from [upstream]
# - If api_key is omitted, uses default_api_key from [upstream]
# - Model names with "/" or "." are normalized for config keys:
#   * "deepseek/deepseek-v3.2-exp" → [models.deepseek-deepseek-v3-2-exp]
#   * "gemini-2.5-flash" → [models.gemini-2-5-flash]
#   * "z-ai/glm-5" → [models.z-ai-glm-5]
# - Original model names are preserved in API calls to upstream
#
# Multiple upstreams per model (load balancing) is a future feature.
# See docs/multiple_upstream_analysis.md for details.
